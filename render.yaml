services:
  # ------------------------------------------------------------
  # Backend Express API Web Service
  # ------------------------------------------------------------
  - type: web
    name: movie-genre-evolution-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        value: "*"
      - key: NODE_VERSION
        value: 20

  # ------------------------------------------------------------
  # Frontend React / Vite Static Site
  # ------------------------------------------------------------
  - type: web
    name: movie-genre-evolution-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
