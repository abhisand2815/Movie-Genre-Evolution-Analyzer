<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="barGrad4" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Film Strip Top Header -->
  <path d="M12 14 C12 11.79 13.79 10 16 10 L48 10 C50.21 10 52 11.79 52 14 L52 18 L12 18 Z" fill="#1e293b"/>
  <!-- Film Sprocket Holes -->
  <rect x="15" y="12" width="4" height="4" rx="1" fill="#f8fafc"/>
  <rect x="23" y="12" width="4" height="4" rx="1" fill="#f8fafc"/>
  <rect x="31" y="12" width="4" height="4" rx="1" fill="#f8fafc"/>
  <rect x="39" y="12" width="4" height="4" rx="1" fill="#f8fafc"/>
  <rect x="47" y="12" width="4" height="4" rx="1" fill="#f8fafc"/>

  <!-- Evolution Analytics Chart Bars -->
  <g filter="url(#shadow)">
    <!-- Bar 1 -->
    <rect x="15" y="38" width="7" height="14" rx="2" fill="url(#barGrad1)"/>
    <!-- Bar 2 -->
    <rect x="25" y="30" width="7" height="22" rx="2" fill="url(#barGrad2)"/>
    <!-- Bar 3 -->
    <rect x="35" y="24" width="7" height="28" rx="2" fill="url(#barGrad3)"/>
    <!-- Bar 4 -->
    <rect x="45" y="18" width="7" height="34" rx="2" fill="url(#barGrad4)"/>

    <!-- Evolution Trend Line + Endpoint Circle -->
    <path d="M18.5 35 L28.5 27 L38.5 21 L48.5 15" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="48.5" cy="15" r="3.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  </g>
</svg>